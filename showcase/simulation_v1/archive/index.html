<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE // Logged Fillámends & Field Records — DAC-04</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/typography.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <style>
    body {
      background: #0a0d0b;
      color: #d6e2d4;
      padding: 24px;
      font-family: var(--font-mono);
    }
    .archive-container {
      max-width: 1300px;
      margin: 0 auto;
    }
    .arch-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #233125;
      padding-bottom: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .arch-title-group h1 {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .arch-meta-sub {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #7d9480;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #111713;
      border: 1px solid #212f23;
      border-radius: 4px;
      padding: 14px 18px;
    }
    .stat-label {
      font-size: 0.68rem;
      color: #6d8270;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    .stat-val {
      font-size: 1.6rem;
      font-weight: 700;
      color: #86e3ce;
    }
    .stat-card.sand .stat-val {
      color: #e3c686;
    }
    .controls-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 8px 14px;
      border: 1px solid #2a3a2d;
      background: #121a14;
      color: #8fa291;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #86e3ce;
      color: #0b130f;
      border-color: #86e3ce;
      font-weight: 700;
    }
    .search-input {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 8px 14px;
      background: #111713;
      border: 1px solid #263628;
      color: #d6e2d4;
      border-radius: 3px;
      width: 280px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .specimen-card {
      background: #111813;
      border: 1px solid #243427;
      border-radius: 4px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .specimen-card:hover {
      transform: translateY(-2px);
      border-color: #3b553f;
    }
    .specimen-card.water {
      border-left: 4px solid #86e3ce;
    }
    .specimen-card.sand {
      border-left: 4px solid #e3c686;
    }
    .specimen-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      border-bottom: 1px solid #1f2a21;
      padding-bottom: 8px;
    }
    .specimen-id {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #fff;
    }
    .specimen-user {
      font-size: 0.72rem;
      color: #86e3ce;
    }
    .specimen-card.sand .specimen-user {
      color: #e3c686;
    }
    .specimen-trans {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.15rem;
      color: #e5ede3;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .specimen-obs {
      font-size: 0.82rem;
      color: #9cb19c;
      line-height: 1.5;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px;
      border-radius: 3px;
      border-left: 2px solid #2d3e30;
    }
    .specimen-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      color: #6d8270;
      border-top: 1px dashed #202d22;
      padding-top: 10px;
    }
    .fingerprint-canvas {
      width: 100%;
      height: 60px;
      background: #090c0a;
      border: 1px solid #1a251c;
      border-radius: 2px;
      margin-bottom: 12px;
    }
    .audio-play-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 2px;
      background: #192720;
      color: #86e3ce;
      cursor: pointer;
      border: 1px solid #2b4537;
      margin-bottom: 10px;
      align-self: flex-start;
    }
    @media (max-width: 768px) {
      .stats-bar { grid-template-columns: 1fr 1fr; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="archive-container">

  <!-- HEADER -->
  <header class="arch-header">
    <div class="arch-title-group">
      <h1>DAC-04 ARCHIVAL REGISTRY</h1>
      <div class="arch-meta-sub">
        PERMANENT SUBSTRATE REPOSITORY // LOGGED FILLÁMENDS & TRANSDUCER SIGNALS
      </div>
    </div>

    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <a href="/laptop/" class="head-btn">FIELD RECEIVER ↗</a>
      <a href="/phone/" class="head-btn">HANDHELD READER ↗</a>
      <a href="/repair/" class="head-btn">REPAIR BAY ↗</a>
      <a href="/" class="head-btn">FIELD GUIDE ↗</a>
    </div>
  </header>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-card">
      <span class="stat-label">RECOVERED FILLÁMENDS</span>
      <div id="stat-total" class="stat-val">0</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">WATER NODES</span>
      <div id="stat-water" class="stat-val">0</div>
    </div>
    <div class="stat-card sand">
      <span class="stat-label">SAND NODES</span>
      <div id="stat-sand" class="stat-val">0</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">RESONANCE SPECTRUM</span>
      <div class="stat-val" style="font-size: 1.2rem; line-height: 2rem;">80 — 1200 HZ</div>
    </div>
  </div>

  <!-- SEARCH & FILTER -->
  <div class="controls-strip">
    <div class="filter-tabs">
      <button class="tab-btn active" data-filter="ALL">ALL SPECIMENS</button>
      <button class="tab-btn" data-filter="WATER">WATER FIELDS</button>
      <button class="tab-btn" data-filter="SAND">SAND FIELDS</button>
    </div>

    <input type="text" id="search-input" class="search-input" placeholder="Search by researcher, freq, keyword...">
  </div>

  <!-- CARDS GRID -->
  <div id="cards-grid" class="cards-grid">
    <!-- Populated dynamically from /api/logs -->
  </div>

</div>

<script>
let logsData = [];
let activeFilter = 'ALL';
let searchQuery = '';

function drawFingerprint(canvas, freq, element) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = canvas.offsetHeight;
  ctx.fillStyle = '#080b09';
  ctx.fillRect(0, 0, w, h);

  const isSand = element === 'SAND';
  ctx.strokeStyle = isSand ? '#e3c686' : '#86e3ce';
  ctx.lineWidth = 1.5;

  ctx.beginPath();
  const cy = h / 2;
  const k = (freq || 440) * 0.03;

  for (let x = 0; x < w; x += 2) {
    const norm = x / w;
    const wave = isSand 
      ? Math.sin(norm * k) * Math.cos(norm * 6) * 18
      : Math.sin(norm * k) * 16 * Math.sin(norm * Math.PI);
    const y = cy + wave;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function renderCards() {
  const container = document.querySelector('#cards-grid');
  if (!container) return;

  const filtered = logsData.filter(log => {
    const matchElem = activeFilter === 'ALL' || (log.element || 'WATER').toUpperCase() === activeFilter;
    const text = `${log.username} ${log.observation} ${log.transmission} ${log.freq}`.toLowerCase();
    const matchSearch = !searchQuery || text.includes(searchQuery);
    return matchElem && matchSearch;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="color: #667c69; grid-column: 1 / -1; padding: 40px; text-align: center;">No fillámend records match the current filter.</div>';
    return;
  }

  container.innerHTML = filtered.map(log => {
    const isSand = (log.element || '').toUpperCase() === 'SAND';
    const elem = isSand ? 'SAND' : 'WATER';
    const username = log.username || 'Researcher';
    const time = log.timestamp ? new Date(log.timestamp).toLocaleDateString() + ' ' + new Date(log.timestamp).toLocaleTimeString() : 'EPOCH RECORD';

    return `
      <div class="specimen-card ${elem.toLowerCase()}">
        <div>
          <div class="specimen-top">
            <span class="specimen-id">${log.id || 'SPECIMEN'}</span>
            <span class="specimen-user">[${username}] [${elem}]</span>
          </div>

          <canvas class="fingerprint-canvas" data-freq="${log.freq || 440}" data-element="${elem}"></canvas>

          <div class="specimen-trans">“${log.transmission || 'TRANSMISSION RECOVERED'}”</div>
          <div class="specimen-obs"><strong>OBSERVATION:</strong> ${log.observation || 'No additional field observation recorded.'}</div>

          ${log.audioRecording ? `<button class="audio-play-badge" onclick="playAudio('${log.audioRecording}')">▶ PLAY ACOUSTIC MEMO</button>` : ''}
        </div>

        <div class="specimen-foot">
          <span>FREQ: <strong>${log.freq || 440} HZ</strong> // BAND: ${log.band || 120}</span>
          <span>${time}</span>
        </div>
      </div>
    `;
  }).join('');

  // Render mini acoustic fingerprints
  document.querySelectorAll('.fingerprint-canvas').forEach(cvs => {
    drawFingerprint(cvs, Number(cvs.dataset.freq), cvs.dataset.element);
  });
}

function playAudio(base64) {
  try {
    const snd = new Audio(base64);
    snd.play();
  } catch(e) {
    console.warn('Audio playback error', e);
  }
}

function updateStats() {
  document.querySelector('#stat-total').textContent = logsData.length;
  document.querySelector('#stat-water').textContent = logsData.filter(l => (l.element || '').toUpperCase() === 'WATER').length;
  document.querySelector('#stat-sand').textContent = logsData.filter(l => (l.element || '').toUpperCase() === 'SAND').length;
}

function loadLogs() {
  fetch('/api/logs')
    .then(r => r.json())
    .then(data => {
      logsData = data || [];
      updateStats();
      renderCards();
    })
    .catch(e => console.warn('Could not fetch logs', e));
}

// Connect WebSocket for real-time live log arrival
function connectWs() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'FILLÁMEND_LOG' || msg.type === 'LOG') {
        logsData.unshift(msg);
        updateStats();
        renderCards();
      }
    } catch(err) {}
  };
  ws.onclose = () => setTimeout(connectWs, 3000);
}

// Filter button listeners
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderCards();
  });
});

document.querySelector('#search-input')?.addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase().trim();
  renderCards();
});

loadLogs();
connectWs();
</script>

</body>
</html>
